services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dulox-api
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/dulox?schema=public
      - NODE_ENV=development
    depends_on:
      - db
    # restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: dulox-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dulox
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: dulox-mailpit
    restart: always
    ports:
      - "1026:1025" # Servidor SMTP local (1026 en host -> 1025 en contenedor)
      - "8026:8025" # Interfaz Web Dulox Mailpit (http://localhost:8026)

volumes:
  pgdata:
