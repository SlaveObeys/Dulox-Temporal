services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dulox-api
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/dulox?schema=public
      - NODE_ENV=development
    depends_on:
      - db
    # restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: dulox-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dulox
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
